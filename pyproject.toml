[project]
name = "localis"
version = "2.1.0"
description = "Fast, offline access to comprehensive data for countries, subdivisions, cities and macroregions. Built on ISO 3166, GeoNames and Unicode CLDR datasets (updated monthly) with support for exact lookups, filtering, and fuzzy search."
readme = "README.md"
authors = [
  {name = 'danimal', email= 'dan.stoffels@gmail.com'}
]
license = "MIT AND LGPL-2.1-or-later AND CC-BY-4.0 AND Unicode-3.0 AND CC0-1.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
keywords = [
  "country", "subdivision", "city", "macroregion", "region", "state", "province",
  "iso", "3166", "iso-3166", "3166-1", "3166-2", "3166-3", "m49", "geocoding", "country codes", "geonames", "cldr", "wikidata", "geography", "geodata", "gazetteer", "offline", "fuzzy-search",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.11"
dependencies = [
  "rapidfuzz>=3.13.0",
]

[project.urls]
homepage = "https://pypi.org/project/localis/"
repository = "https://github.com/dstoffels/localis"
funding = "https://github.com/sponsors/dstoffels"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-watch>=4.2.0",
  "pytest-cov>=7.0.0,<8",
  "pytest-xdist>=3.8.0,<4",
  "black>=25.11.0,<27",
  "ruff>=0.14.6,<0.15",
  "watchfiles>=1.1.1,<2",
  "mcp>=2.2.0,<3",
  "pyright>=1.1.414,<2",
  "poethepoet>=0.48.0",
]

[tool.poe.tasks]
ingest = { cmd = "python -m ingest", help = "Run the ingest pipeline; --force rebuilds every stage" }
analysis = { cmd = "python -m tests.analysis", help = "Regenerate data stats, footprint and benchmarks, and fill the docs' stat markers" }
test = { cmd = "pytest", help = "Run the test suite" }
watch = { cmd = "ptw", help = "Re-run the tests on every change" }
watch-fast = { cmd = "ptw -- --fast", help = "Re-run the tests on every change, skipping slow tests" }
typecheck = { cmd = "pyright", help = "Type-check the project" }
sync-main = { shell = "git pull --no-rebase --no-edit && git pull --no-rebase --no-edit origin main && git push", help = "Bring the active branch up to date with its remote and with origin/main, then push it" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localis"]

[tool.hatch.build.targets.sdist]
include = ["src/localis", "README.md", "LICENSE", "LICENSES"]

[tool.hatch.build]
dev-mode-dirs = ["src", "."]
