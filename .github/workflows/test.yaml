name: Test

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install Deps
        run: uv sync --locked

      - name: Configure git identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run ingest
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: uv run poe ingest

      - name: Check for unexpected dataset changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          if [ -n "$(git status --porcelain -- src/localis/data)" ]; then
            git add -A
            git commit -m "chore: automated data ingest"
            git push origin HEAD:dev
            echo "::error::Dataset changed during ingest validation and was committed to dev. That commit has not been tested; review the diff and push again before merging to main."
            exit 1
          fi

      - name: Type Check
        run: uv run poe typecheck

      - name: Run Tests
        run: uv run poe test
