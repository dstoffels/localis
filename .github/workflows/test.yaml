name: Test

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Deps
        run: uv sync --locked

      - name: Run ingest
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && matrix.python-version == '3.11'
        run: uv run poe ingest

      - name: Check for unexpected dataset changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && matrix.python-version == '3.11'
        run: |
          if [ -n "$(git status --porcelain -- src/localis/data)" ]; then
            git status --porcelain -- src/localis/data
            echo "::error::Ingest changed the committed dataset, so it's out of sync with the pipeline. Run 'poe ingest' locally, commit the data and push again."
            exit 1
          fi

      - name: Type Check
        if: matrix.python-version == '3.11'
        run: uv run poe typecheck

      - name: Run Tests
        run: uv run poe test
