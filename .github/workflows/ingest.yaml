name: Ingest

on:
  schedule:
    - cron: "0 6 1 * *"
  push:
    branches:
      - ingest

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: github.repository == 'dstoffels/localis'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ingest
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge latest dev
        run: |
          git fetch origin dev
          if ! git merge --no-edit origin/dev; then
            echo "::error::Merge conflict pulling dev into ingest. Resolve locally: git checkout ingest && git pull && git merge dev, then push."
            exit 1
          fi

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Cache deps
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install deps
        run: poetry install

      - name: Run full ingest pipeline
        run: poetry run ingest

      - name: Bump version if the published dataset changed
        id: version
        run: |
          if git diff --quiet -- src/localis/data; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            poetry version patch
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$(poetry version -s)" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage changes
        id: stage
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.stage.outputs.changed == 'true'
        run: |
          if [ "${{ steps.version.outputs.bumped }}" == "true" ]; then
            git commit -m "chore: automated data ingest (v${{ steps.version.outputs.version }})"
          else
            git commit -m "chore: automated data ingest"
          fi

      - name: Push ingest branch
        run: git push origin ingest

      - name: Ensure PR exists
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head ingest --base dev --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --head ingest --base dev \
              --title "Automated data ingest" \
              --body "This PR is maintained automatically by the ingest workflow and always reflects the current state of the \`ingest\` branch. Each run comments below with what changed."
          fi

      - name: Comment on PR with this run's changes
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Ingest run: $(date -u +%Y-%m-%d)"
            echo
            if [ "${{ steps.version.outputs.bumped }}" == "true" ]; then
              echo "Dataset changed, version bumped to \`${{ steps.version.outputs.version }}\`."
            else
              echo "Only bookkeeping files changed; no dataset version bump."
            fi
            echo
            echo '```'
            git diff --stat HEAD~1 HEAD -- src/localis/data
            echo '```'
          } > run_summary.md
          gh pr comment ingest --body-file run_summary.md
