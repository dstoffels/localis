name: Ingest

on:
  schedule:
    - cron: "0 6 1 * *"
  push:
    branches:
      - ingest

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  # runs the pipeline read-only and commits locally; its commits reach publish as a git bundle, so the job holding write access runs no project code
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.repository == 'dstoffels/localis'

    outputs:
      orphans: ${{ steps.orphans.outputs.count }}
      data_changed: ${{ steps.version.outputs.data_changed }}
      bumped: ${{ steps.version.outputs.bumped }}
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.stage.outputs.changed }}
      has_commits: ${{ steps.bundle.outputs.has_commits }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ingest
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: "3.11"
          enable-cache: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge latest dev
        run: |
          git fetch origin dev
          if ! git merge --no-edit origin/dev; then
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                src/localis/data/*|ingest/*/inputs/*.manifest.json|pyproject.toml|uv.lock)
                  git checkout --theirs -- "$f"
                  git add -- "$f"
                  ;;
                *)
                  echo "::error::Merge conflict in $f pulling dev into ingest. Resolve locally: git checkout ingest && git pull && git merge dev, then push."
                  exit 1
                  ;;
              esac
            done
            git commit --no-edit
          fi

      - name: Install deps
        run: uv sync --locked

      - name: Run full ingest pipeline
        id: ingest
        run: |
          set +e
          uv run poe ingest
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # exit 10 means orphans need resolving; the next step records them for publish to push before failing
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then
            exit "$code"
          fi

      - name: Record orphans
        id: orphans
        if: steps.ingest.outputs.exit_code == '10'
        run: |
          count=$(python -c "import json; m = json.load(open('ingest/subdivisions/outputs/resolution_map.json')); print(sum(len(b) for b in m['automerge']['orphans'].values()))")
          git add ingest/subdivisions/outputs/resolution_map.json ingest/*/logs/*.log ingest/pipeline.log
          if ! git diff --cached --quiet; then
            git commit -m "chore: ingest found $count orphans awaiting resolution"
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Type Check
        if: steps.ingest.outputs.exit_code == '0'
        run: uv run poe typecheck

      - name: Run Tests
        if: steps.ingest.outputs.exit_code == '0'
        run: uv run poe test

      - name: Bump version if the published dataset changed
        id: version
        if: steps.ingest.outputs.exit_code == '0'
        run: |
          current="$(uv version --short)"
          if [ -z "$(git status --porcelain -- src/localis/data)" ]; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            uv version --bump patch
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Stage changes
        id: stage
        if: steps.ingest.outputs.exit_code == '0'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.stage.outputs.changed == 'true'
        env:
          BUMPED: ${{ steps.version.outputs.bumped }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$BUMPED" == "true" ]; then
            git commit -m "chore: automated data ingest (v$VERSION)"
          else
            git commit -m "chore: automated data ingest"
          fi

      - name: Bundle new commits
        id: bundle
        run: |
          if [ "$(git rev-list --count origin/ingest..HEAD)" -eq 0 ]; then
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
          else
            git bundle create ingest.bundle origin/ingest..HEAD
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.bundle.outputs.has_commits == 'true'
        with:
          name: ingest-bundle
          path: ingest.bundle
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.build.outputs.has_commits == 'true'
        with:
          ref: ingest
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.outputs.has_commits == 'true'
        with:
          name: ingest-bundle

      - name: Push ingest branch
        if: needs.build.outputs.has_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch ingest.bundle HEAD
          gh auth setup-git
          git push origin FETCH_HEAD:refs/heads/ingest

      - name: Summarize this run's change report
        if: needs.build.outputs.changed == 'true'
        run: |
          # each stage report's counts row, linked to the full report at this run's commit
          base="https://github.com/${GITHUB_REPOSITORY}/blob/$(git rev-parse FETCH_HEAD)"
          {
            echo "| Stage | Records | Added | Removed | Changed |"
            echo "|---|---|---|---|---|"
            for report in $(git ls-tree -r --name-only FETCH_HEAD -- ingest | grep '/outputs/change_report\.md$'); do
              stage=$(basename "$(dirname "$(dirname "$report")")")
              counts=$(git show "FETCH_HEAD:$report" | grep -m1 -E '^\| [0-9,]+ → ')
              echo "| [$stage]($base/$report) $counts"
            done
          } > report_summary.md

      - name: Open or update the PR
        if: needs.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "This PR is maintained automatically by the ingest workflow and always reflects the current state of the \`ingest\` branch. Below is the latest run's change report, which compares that run's build with the one before it on \`ingest\`, not this PR's whole diff against \`dev\`; each run also comments with its own. Type check and tests ran in the ingest workflow itself before this was pushed, since bot-opened PRs don't trigger the Test workflow."
            echo
            cat report_summary.md
          } > pr_body.md
          existing=$(gh pr list --head ingest --base dev --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --head ingest --base dev --title "Automated data ingest" --body-file pr_body.md
          else
            gh pr edit "$existing" --body-file pr_body.md
          fi

      - name: Comment on PR with this run's changes
        if: needs.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMPED: ${{ needs.build.outputs.bumped }}
          DATA_CHANGED: ${{ needs.build.outputs.data_changed }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### Ingest run: $(date -u +%Y-%m-%d)"
            echo
            if [ "$BUMPED" == "true" ]; then
              echo "Dataset changed, version bumped to \`$VERSION\`."
            elif [ "$DATA_CHANGED" == "true" ]; then
              echo "Dataset changed; rides along with unreleased version \`$VERSION\`, no bump."
            else
              echo "Only bookkeeping files changed; no dataset version bump."
            fi
            echo
            cat report_summary.md
          } > run_summary.md
          gh pr comment ingest --body-file run_summary.md

      - name: Fail on orphans
        if: needs.build.outputs.orphans != ''
        env:
          ORPHANS: ${{ needs.build.outputs.orphans }}
        run: |
          echo "::error::Ingest found $ORPHANS subdivision orphans; the queue is committed to the ingest branch. Resolve locally: pull ingest, run 'poe ingest' to reproduce the orphans in staging, run the resolve-subdivisions skill, run 'poe ingest' again, then commit and push to ingest."
          exit 1
