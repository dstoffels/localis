name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.repository == 'dstoffels/localis'

    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      should_release: ${{ steps.check_versions.outputs.SHOULD_RELEASE }}
      is_prerelease: ${{ steps.check_prerelease.outputs.IS_PRERELEASE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: '3.11'
          enable-cache: false # no need, GitHub-hosted runners already cache by default

      - name: Get project version
        id: get_version
        run: echo "VERSION=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check_versions
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Nothing to release."
            echo "SHOULD_RELEASE=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $TAG. Generating new release."
            echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a CHANGELOG section for the version
        if: steps.check_versions.outputs.SHOULD_RELEASE == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section; rename [Unreleased] to the version before releasing it."
            exit 1
          fi

      - name: Determine if pre-release (PEP 440)
        id: check_prerelease
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if [[ "$VERSION" =~ (a|alpha|b|beta|rc|\.dev)[0-9]*$ ]]; then
            echo "Incoming version is a pre-release."
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: '3.11'
          enable-cache: false

      - name: Build
        run: uv build --build-constraints .github/build-constraints.txt --require-hashes

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  # installs the built wheel from the uploaded artifact in a fresh environment and checks it, apart from the build job so the third-party packages it installs never share a job with the build output
  smoke:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/smoke_test.py
          sparse-checkout-cone-mode: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: '3.11'
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install the wheel and check it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          # run outside the checkout, so localis can only import from the installed wheel
          cp .github/smoke_test.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/bin/python" smoke_test.py

  publish:
    needs: [check, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: pypi
      url: https://pypi.org/project/localis/${{ needs.check.outputs.version }}/

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # tags the release and attaches the same files once PyPI has them
  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Extract the version's CHANGELOG section
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # the lines under '## [VERSION]' up to the next version heading
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > notes.md

      - name: Generate new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          IS_PRERELEASE: ${{ needs.check.outputs.is_prerelease }}
          SHA: ${{ github.sha }}
        run: |
          prerelease=()
          if [ "$IS_PRERELEASE" == "true" ]; then
            prerelease=(--prerelease)
          fi
          gh release create "v$VERSION" dist/*.whl dist/*.tar.gz \
            --title "v$VERSION" \
            --target "$SHA" \
            --notes-file notes.md \
            "${prerelease[@]}"
