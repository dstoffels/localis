name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  # decides whether main's version is new; runs on every tested push to main and deploys nothing
  check:
    runs-on: ubuntu-latest

    if: >-
      github.repository == 'dstoffels/localis' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      should_release: ${{ steps.check_versions.outputs.SHOULD_RELEASE }}
      is_prerelease: ${{ steps.check_prerelease.outputs.IS_PRERELEASE }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'

      - name: Get project version
        id: get_version
        run: echo "VERSION=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check_versions
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Nothing to release."
            echo "SHOULD_RELEASE=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $TAG. Generating new release."
            echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine if pre-release (PEP 440)
        id: check_prerelease
        run: |
          if [[ "${{ steps.get_version.outputs.VERSION }}" =~ (a|alpha|b|beta|rc|.dev)[0-9]*$ ]]; then
            echo "Incoming version is a pre-release."
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

  # builds, tags and publishes a new version; the pypi environment records it under the repo's Deployments
  publish:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/localis/${{ needs.check.outputs.version }}/

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Build
        run: uv build

      - name: Generate new release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.check.outputs.is_prerelease }}
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
